# LOGIN SETUP: Netlify's managed OAuth service handles authentication.
# Register a GitHub OAuth App with these exact settings:
# Name: Ahmad's Notes CMS
# Homepage URL: https://ahmad.anasweh.com
# Authorization callback URL: https://api.netlify.com/auth/done
# Save Client ID and Client Secret in Netlify project ahmad-anasweh-notes-auth:
# Project configuration > Access & security > OAuth > Install provider > GitHub.
# Never commit the secret. No secret or client ID belongs in this file.
# site_domain selects the Netlify authentication project; the site stays on Pages.
# See SETUP.md for direct links and the remaining steps.
backend:
  name: github
  repo: AhmadAnasweh/AhmadAnasweh.github.io
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: ahmad.anasweh.com

site_url: https://ahmad.anasweh.com
display_url: https://ahmad.anasweh.com

# Save creates an unpublished GitHub draft. Only Publish updates the live site.
publish_mode: editorial_workflow
media_folder: "notes/files"
public_folder: "/notes/files"

collections:
  - name: notes
    label: Notes
    folder: notes
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} | {{category}} | {{status}} | Created {{created | date('YYYY-MM-DD HH:mm')}} | Edited {{commit_date | date('YYYY-MM-DD HH:mm')}}"
    sortable_fields: ["commit_date", "created", "status", "category", "title"]
    view_groups:
      - label: Category
        field: category
      - label: Status
        field: status
    view_filters:
      - label: Investigations
        field: category
        pattern: incident-response
      - label: Digital forensics
        field: category
        pattern: digital-forensics
      - label: Threat hunting
        field: category
        pattern: threat-hunting
      - label: Detection engineering
        field: category
        pattern: detection-engineering
      - label: Malware analysis
        field: category
        pattern: malware-analysis
      - label: Cloud security
        field: category
        pattern: cloud-security
      - label: OSINT
        field: category
        pattern: osint
      - label: Pinned cheat sheets
        field: category
        pattern: cheat-sheets
      - label: Reference & workflow
        field: category
        pattern: reference
    fields:
      - label: Category
        name: category
        widget: select
        default: reference
        hint: "Choose the main topic. The editor can group, filter, and sort notes by this field."
        options:
          - { label: "Incident response", value: "incident-response" }
          - { label: "Digital forensics", value: "digital-forensics" }
          - { label: "Threat hunting", value: "threat-hunting" }
          - { label: "Detection engineering", value: "detection-engineering" }
          - { label: "Malware analysis", value: "malware-analysis" }
          - { label: "Cloud security", value: "cloud-security" }
          - { label: "OSINT", value: "osint" }
          - { label: "Pinned cheat sheets", value: "cheat-sheets" }
          - { label: "Reference & workflow", value: "reference" }
      - label: Status
        name: status
        widget: select
        default: draft
        hint: "Set the note's current reliability or lifecycle state."
        options:
          - { label: "Draft", value: "draft" }
          - { label: "Tested", value: "tested" }
          - { label: "In use", value: "in-use" }
          - { label: "Archived", value: "archived" }
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: "Add any tags you like, separated by commas (for example: windows, splunk, forensics)."
      - label: Last updated
        name: updated
        widget: datetime
        default: "{{now}}"
        picker_utc: true
        hint: "For an existing note, set this to today whenever you make a meaningful update."
      - label: Created
        name: created
        widget: datetime
        default: "{{now}}"
        picker_utc: true
        hint: "Filled in when a note is created. Keep this original date when editing."
      - { label: Title, name: title, widget: emoji_title, hint: "Use the emoji picker or type any emoji directly into the title." }
      - { label: Body, name: body, widget: markdown, hint: "Write Markdown or paste a full article here. Images and text after them are kept in order." }
      - { label: File, name: file, widget: file, required: false, hint: "Optional attachment below the note. For images in the note body, use Add image or paste into Body." }
