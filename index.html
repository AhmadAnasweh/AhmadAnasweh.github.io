<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ahmad's SOC and DFIR notes, walkthroughs, and field references.">
  <meta name="color-scheme" content="dark">
  <title>Ahmad's Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #62d9bd; --text-color: #d8e2ee; }
    body { background: #101820; color: var(--text-color); }
    .sidebar, .sidebar-toggle { background: #131e29; }
    .sidebar { border-color: #2c3c4c; }
    .sidebar ul li a, .sidebar > h1 a { color: #b9c9da; }
    .markdown-section { max-width: 900px; padding: 40px 32px 80px; }
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section strong, .markdown-section .anchor span { color: #edf4fc; }
    .markdown-section pre, .markdown-section code { background: #1b2937; }
    .markdown-section pre > code { color: #d8e2ee; }
    .markdown-section code { color: #8be3cf; }
    .markdown-section blockquote { color: #b9c9da; }
    .markdown-section tr:nth-child(2n) { background: #1b2937; }
    .markdown-section th, .markdown-section td { border-color: #3a4c5f; }
    .markdown-section hr { border-color: #3a4c5f; }
    .search input { background: #1b2937; color: #edf4fc; }
    .search .matching-post, .search { border-color: #3a4c5f !important; }
    .search .search-keyword { color: #101820; background: #62d9bd; }
    .app-nav a { color: #d8e2ee; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #62d9bd; outline-offset: 3px; }
  </style>
</head>
<body>
  <div id="app">Loading Ahmad's Notes…</div>
  <noscript>Enable JavaScript to read this site, or browse the Markdown files on GitHub.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <script>
    window.$docsify = {
      name: "Ahmad's Notes",
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      search: { paths: 'auto', placeholder: 'Search notes', noData: 'No matching notes.', depth: 3 },
      copyCode: { buttonText: 'Copy', successText: 'Copied', errorText: 'Try again' },
      plugins: [function (hook) {
        // Decap writes YAML metadata. Render its title and optional attachment.
        hook.beforeEach(function (content) {
          var match = content.match(/^---\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
          if (!match) return content;
          var metadata;
          try { metadata = jsyaml.load(match[1]) || {}; }
          catch (error) { console.warn('Invalid note metadata', error); return content; }
          var body = content.slice(match[0].length);
          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (char) {
              return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
            });
          }
          if (metadata.title && !/^#\s/m.test(body)) body = '<h1>' + escapeHtml(metadata.title) + '</h1>\n\n' + body;
          if (typeof metadata.file === 'string' && metadata.file.startsWith('/notes/files/')) {
            var url = new URL(metadata.file, window.location.origin);
            if (url.origin === window.location.origin && url.pathname.startsWith('/notes/files/')) {
              body += '\n\n<p><a data-no-router download href="' + escapeHtml(url.pathname) + '">Download attachment</a></p>\n';
            }
          }
          return body;
        });
      }]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
